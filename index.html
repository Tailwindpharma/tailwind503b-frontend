<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TailwindAI 503b — FDA Compounding Enforcement Search</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
.btn-green{background:#00A651;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:background .15s}.btn-green:hover{background:#008C44}.btn-green:disabled{background:#E2E8F0;color:#94A3B8;cursor:default}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:24px}.card:hover{border-color:#CBD5E1}input:focus,select:focus{border-color:#00A651!important;outline:none}a{color:#00A651;text-decoration:none}a:hover{color:#008C44}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useCallback}=React;
const API="https://tailwindai-503b-production.up.railway.app";
const NV="#0F2B5B",GR="#00A651";

async function doSearch(query,filters){
  const r=await fetch(API+"/api/demo-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:query,filters:filters})});
  if(!r.ok){const e=await r.text();throw new Error(e);}
  const data=await r.json();
  const sources=(data.sources||[]).map(s=>({pharmacy_name:s.pharmacy_name||"Unknown",doc_type:s.doc_type||"unknown",date:s.date||"",state:s.state||"",facility_type:s.facility_type||"unknown",url:s.source_url||"",relevance:s.relevance_score||0}));
  return{answer:data.answer,sources:sources};
}

const SAMPLES=["Has FDA cited insanitary conditions at compounding pharmacies?","Which 503B facilities in Texas received warning letters?","Show me Empower Pharmacy enforcement history","Common sterility violations for outsourcing facilities","Environmental monitoring citations in California"];
const SearchIcon=()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
const FileIcon=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>;
const Chev=({open})=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{transform:open?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s",display:"inline-block",verticalAlign:"middle"}}><polyline points="6 9 12 15 18 9"/></svg>;
const Check=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={GR} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const Logo=({big})=><div style={{display:"flex",alignItems:"center",fontWeight:800,fontSize:big?26:18,letterSpacing:"-0.02em"}}><span style={{color:NV}}>Tailwind</span><span style={{color:GR}}>AI</span><span style={{color:NV,fontSize:big?18:13,marginLeft:2}}>503b</span></div>;

const Badge=({children,variant="default"})=>{
  const m={"default":{bg:"#F1F5F9",c:"#475569",bc:"#E2E8F0"},"483":{bg:"#FFF7ED",c:"#9A3412",bc:"#FED7AA"},"warning_letter":{bg:"#FEF2F2",c:"#991B1B",bc:"#FECACA"},"untitled_letter":{bg:"#F5F3FF",c:"#5B21B6",bc:"#DDD6FE"},"fmd_145":{bg:"#EFF6FF",c:"#1E40AF",bc:"#BFDBFE"},"state_referral":{bg:"#FDF4FF",c:"#86198F",bc:"#F0ABFC"},"503A":{bg:"#ECFDF5",c:"#065F46",bc:"#A7F3D0"},"503B":{bg:"#EFF6FF",c:"#1E3A5F",bc:"#BFDBFE"}};
  const s=m[variant]||m["default"];
  return <span style={{display:"inline-flex",alignItems:"center",padding:"2px 10px",borderRadius:6,fontSize:12,fontWeight:500,background:s.bg,color:s.c,border:"1px solid "+s.bc}}>{children}</span>;
};
const docLabel=t=>({"483":"Form 483","warning_letter":"Warning Letter","untitled_letter":"Untitled Letter","fmd_145":"FMD-145","state_referral":"State Referral","recall":"Recall"})[t]||t;

function SourceCard({source}){
  return(<div className="card" style={{padding:16,borderRadius:10}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,marginBottom:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0,overflow:"hidden"}}>
        <span style={{color:"#94A3B8",flexShrink:0}}><FileIcon/></span>
        <span style={{fontWeight:600,fontSize:14,color:NV,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{source.pharmacy_name}</span>
      </div>
      <span style={{fontSize:11,color:"#64748B",background:"#F8FAFC",padding:"2px 8px",borderRadius:4,fontFamily:"monospace",flexShrink:0}}>{Math.round(source.relevance*100)}%</span>
    </div>
    <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:6}}>
      <Badge variant={source.doc_type}>{docLabel(source.doc_type)}</Badge>
      {source.facility_type&&source.facility_type!=="unknown"&&<Badge variant={source.facility_type}>{source.facility_type}</Badge>}
      <span style={{fontSize:12,color:"#94A3B8",marginLeft:4}}>{source.state} &middot; {source.date}</span>
    </div>
  </div>);
}

function Landing({onNav}){
  return(<div style={{minHeight:"100vh",background:"#fff",color:"#1E293B"}}>
    <nav style={{borderBottom:"1px solid #F1F5F9",padding:"16px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",maxWidth:1120,margin:"0 auto"}}><Logo/><button onClick={()=>onNav("search")} className="btn-green" style={{fontSize:14,padding:"8px 20px"}}>Try it now</button></nav>
    <div style={{maxWidth:880,margin:"0 auto",padding:"80px 24px 60px",textAlign:"center"}}>
      <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:999,padding:"6px 16px",fontSize:13,color:"#166534",marginBottom:32,fontWeight:500}}>
        <span style={{width:6,height:6,borderRadius:"50%",background:"#22C55E",animation:"pulse2 2s ease-in-out infinite"}}/>631 documents indexed &middot; 274 pharmacies &middot; Updated daily
      </div>
      <h1 style={{fontSize:52,fontWeight:800,lineHeight:1.1,marginBottom:20,color:NV,letterSpacing:"-0.02em",animation:"fadeUp 0.6s ease-out"}}>
        Search every FDA compounding<br/><span style={{color:GR}}>enforcement action</span>
      </h1>
      <p style={{fontSize:18,color:"#64748B",maxWidth:640,margin:"0 auto 48px",lineHeight:1.7}}>AI-powered search across hundreds of 483s, Warning Letters, and enforcement documents. Ask questions in plain English and get cited answers.</p>
      <div style={{maxWidth:640,margin:"0 auto 80px"}}>
        <div style={{background:"#fff",border:"2px solid #E2E8F0",borderRadius:16,padding:6,display:"flex",alignItems:"center",gap:8,boxShadow:"0 4px 24px rgba(15,43,91,0.06)"}}>
          <div style={{paddingLeft:16,color:"#94A3B8"}}><SearchIcon/></div>
          <div style={{flex:1,padding:"12px 8px",textAlign:"left",color:"#94A3B8",fontSize:14,fontStyle:"italic"}}>"Has FDA ever cited insanitary conditions at..."</div>
          <button onClick={()=>onNav("search")} className="btn-green" style={{padding:"12px 24px",borderRadius:12,fontSize:14}}>Try it now</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:20,maxWidth:960,margin:"0 auto 96px",textAlign:"left"}}>
        {[{t:"Natural Language Search",d:"Ask questions like you would to a regulatory expert. AI finds and cites the exact documents.",i:"\uD83D\uDD0D"},{t:"Full-Text OCR Index",d:"Every 483 and Warning Letter PDF is OCR'd and indexed. Search inside documents, not just titles.",i:"\uD83D\uDCC4"},{t:"Daily Updates",d:"Automated monitoring of the FDA compounding actions page. New documents indexed within hours.",i:"\u26A1"}].map((f,i)=>(
          <div key={i} style={{background:"#F8FAFC",border:"1px solid #F1F5F9",borderRadius:12,padding:28}}>
            <div style={{fontSize:28,marginBottom:16}}>{f.i}</div>
            <h3 style={{fontWeight:700,marginBottom:8,fontSize:15,color:NV}}>{f.t}</h3>
            <p style={{fontSize:14,color:"#64748B",lineHeight:1.6}}>{f.d}</p>
          </div>
        ))}
      </div>
      <div style={{marginBottom:80}}>
        <h2 style={{fontSize:36,fontWeight:800,color:NV,marginBottom:8}}>One plan. Unlimited access.</h2>
        <p style={{color:"#64748B",marginBottom:40,fontSize:17}}>No usage caps. No per-search fees. Cancel anytime.</p>
        <div style={{maxWidth:420,margin:"0 auto"}}>
          <div style={{position:"relative",background:"#fff",border:"2px solid "+GR,borderRadius:16,padding:36,textAlign:"left",boxShadow:"0 4px 24px rgba(0,166,81,0.08)"}}>
            <div style={{position:"absolute",top:-13,left:28,background:GR,color:"#fff",fontSize:12,fontWeight:700,padding:"4px 16px",borderRadius:999}}>7-day free trial</div>
            <div style={{fontSize:13,color:GR,fontWeight:700,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"}}>Unlimited Plan</div>
            <div style={{display:"flex",alignItems:"baseline",gap:2,marginBottom:2}}><span style={{fontSize:48,fontWeight:800,color:NV}}>$99</span><span style={{fontSize:16,color:"#94A3B8"}}>/month</span></div>
            <div style={{fontSize:13,color:"#94A3B8",marginBottom:28}}>after free trial</div>
            <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:28}}>
              {["Unlimited searches","Full-text search across all 483s & Warning Letters","AI-powered answers with source citations","Filter by state, facility type, document type","Direct PDF download links","Daily index updates from FDA.gov"].map((f,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,fontSize:14,color:"#334155"}}><Check/>{f}</div>
              ))}
            </div>
            <button onClick={()=>onNav("search")} className="btn-green" style={{width:"100%",padding:"14px 0",borderRadius:10,fontSize:15}}>Start free trial</button>
            <p style={{fontSize:12,color:"#94A3B8",textAlign:"center",marginTop:12}}>No credit card required to start</p>
          </div>
        </div>
      </div>
    </div>
    <footer style={{borderTop:"1px solid #F1F5F9",padding:"28px 24px",textAlign:"center",fontSize:12,color:"#94A3B8",maxWidth:1120,margin:"0 auto"}}>
      <p>TailwindAI 503b is not affiliated with or endorsed by the U.S. Food and Drug Administration.</p>
      <p style={{marginTop:4}}>&copy; 2026 Tailwind Pharma LLC. All rights reserved.</p>
    </footer>
  </div>);
}

function SearchPage({onNav}){
  const[query,setQuery]=useState("");const[searching,setSearching]=useState(false);const[result,setResult]=useState(null);const[error,setError]=useState("");
  const[showFilters,setShowFilters]=useState(false);const[filters,setFilters]=useState({state:"",facility_type:"",doc_type:""});
  const[history,setHistory]=useState([]);const[showSrc,setShowSrc]=useState(true);
  const search=useCallback(async(sq)=>{
    const q=sq||query;if(!q.trim())return;setQuery(q);setSearching(true);setResult(null);setError("");
    try{const res=await doSearch(q,filters);setResult({...res,query:q});setHistory(p=>[{query:q},...p.filter(h=>h.query!==q).slice(0,19)]);}catch(e){setError("Search failed: "+e.message);}
    setSearching(false);
  },[query,filters]);
  const sel={background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:8,fontSize:13,padding:"6px 10px",color:"#334155",outline:"none"};
  return(<div style={{minHeight:"100vh",background:"#FAFBFC"}}>
    <nav style={{background:"#fff",borderBottom:"1px solid #F1F5F9",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div style={{cursor:"pointer"}} onClick={()=>onNav("landing")}><Logo/></div>
      <span style={{display:"inline-flex",alignItems:"center",padding:"2px 10px",borderRadius:6,fontSize:12,fontWeight:500,background:"#ECFDF5",color:"#059669",border:"1px solid #A7F3D0"}}>Live Search</span>
    </nav>
    <div style={{maxWidth:860,margin:"0 auto",padding:"32px 24px"}}>
      <div style={{marginBottom:32}}>
        <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:14,padding:6,display:"flex",alignItems:"center",gap:8,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
          <div style={{paddingLeft:14,color:"#94A3B8"}}><SearchIcon/></div>
          <input type="text" value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()}
            placeholder="Ask about FDA compounding enforcement actions..." style={{flex:1,background:"none",border:"none",fontSize:14,padding:"10px 4px",outline:"none",color:"#1E293B"}}/>
          <button onClick={()=>setShowFilters(!showFilters)}
            style={{fontSize:12,padding:"8px 12px",borderRadius:8,cursor:"pointer",background:showFilters?"#EFF6FF":"transparent",color:showFilters?NV:"#94A3B8",border:showFilters?"1px solid #BFDBFE":"1px solid transparent",display:"flex",alignItems:"center",gap:4}}>
            Filters <Chev open={showFilters}/>
          </button>
          <button onClick={()=>search()} disabled={searching||!query.trim()} className="btn-green" style={{padding:"10px 22px",borderRadius:10,fontSize:14}}>Search</button>
        </div>
        {showFilters&&<div style={{marginTop:8,background:"#fff",border:"1px solid #F1F5F9",borderRadius:12,padding:16,display:"flex",flexWrap:"wrap",gap:16}}>
          {[{k:"state",l:"State",o:["CA","TX","FL","NY","NV","PA","NC","MO","IN","VA","MD","NJ","OH","IL","TN","MA","AZ","KS","GA","WA"]},
            {k:"facility_type",l:"Facility",o:[["503A","503A"],["503B","503B"]]},
            {k:"doc_type",l:"Document",o:[["483","Form 483"],["warning_letter","Warning Letter"],["untitled_letter","Untitled Letter"],["fmd_145","FMD-145"],["state_referral","State Referral"]]}
          ].map(f=><div key={f.k}><label style={{display:"block",fontSize:11,color:"#94A3B8",marginBottom:4,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.05em"}}>{f.l}</label>
            <select value={filters[f.k]} onChange={e=>setFilters({...filters,[f.k]:e.target.value})} style={sel}><option value="">All</option>
              {f.o.map(o=>Array.isArray(o)?<option key={o[0]} value={o[0]}>{o[1]}</option>:<option key={o} value={o}>{o}</option>)}
            </select></div>)}
        </div>}
      </div>
      {error&&<div style={{fontSize:14,color:"#DC2626",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"12px 16px",marginBottom:20}}>{error}</div>}
      {!result&&!searching&&<div style={{marginBottom:40}}>
        <div style={{fontSize:12,color:"#94A3B8",marginBottom:12,fontWeight:500}}>Try a sample query</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {SAMPLES.map((q,i)=><button key={i} onClick={()=>{setQuery(q);search(q);}}
            style={{fontSize:13,background:"#fff",border:"1px solid #E2E8F0",borderRadius:8,padding:"8px 14px",color:"#64748B",cursor:"pointer",textAlign:"left"}}>{q}</button>)}
        </div>
      </div>}
      {searching&&<div style={{padding:"80px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12,color:"#64748B"}}>
          <div style={{position:"relative",width:20,height:20}}><div style={{position:"absolute",inset:0,border:"2px solid #E2E8F0",borderRadius:"50%"}}/><div style={{position:"absolute",inset:0,border:"2px solid #00A651",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 1s linear infinite"}}/></div>
          <span style={{fontSize:14}}>Searching FDA enforcement documents...</span>
        </div>
      </div>}
      {result&&!searching&&<div style={{display:"flex",flexDirection:"column",gap:20}}>
        <div className="card">
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:"linear-gradient(135deg,"+NV+","+GR+")",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#fff",fontSize:10,fontWeight:800}}>AI</span></div>
            <span style={{fontSize:14,fontWeight:600,color:NV}}>Answer</span>
          </div>
          <div style={{fontSize:14,color:"#334155",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{result.answer}</div>
        </div>
        {result.sources&&result.sources.length>0&&<div>
          <button onClick={()=>setShowSrc(!showSrc)} style={{display:"flex",alignItems:"center",gap:8,fontSize:14,color:"#64748B",background:"none",border:"none",cursor:"pointer",marginBottom:12,fontWeight:500}}><Chev open={showSrc}/>{result.sources.length} source documents</button>
          {showSrc&&<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>{result.sources.map((s,i)=><SourceCard key={i} source={s}/>)}</div>}
        </div>}
      </div>}
      {history.length>0&&!searching&&<div style={{marginTop:48,borderTop:"1px solid #F1F5F9",paddingTop:24}}>
        <div style={{fontSize:12,color:"#94A3B8",marginBottom:12,fontWeight:500}}>Recent searches</div>
        {history.slice(0,5).map((h,i)=><button key={i} onClick={()=>{setQuery(h.query);search(h.query);}}
          style={{display:"block",width:"100%",textAlign:"left",fontSize:13,color:"#64748B",padding:"8px 12px",borderRadius:8,background:"none",border:"none",cursor:"pointer"}}>{h.query}</button>)}
      </div>}
      {!result&&!searching&&<div style={{marginTop:64,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        {[{l:"Documents",v:"631"},{l:"Pharmacies",v:"274"},{l:"States",v:"50"},{l:"Updated",v:"Today"}].map((s,i)=>(
          <div key={i} style={{background:"#fff",border:"1px solid #F1F5F9",borderRadius:10,padding:16,textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:800,color:NV}}>{s.v}</div><div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>}
    </div>
  </div>);
}

function App(){const[page,setPage]=useState("landing");return page==="search"?<SearchPage onNav={setPage}/>:<Landing onNav={setPage}/>;}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
